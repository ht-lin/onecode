name: onecode
description: "OneCode – Kartenwallet für Kundenkarten und Gutscheine."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.3.0
  riverpod_annotation: ^4.0.0
  go_router: ^17.0.0
  drift: ^2.34.0 # 本地数据库（M1-01）
  drift_flutter: ^0.3.0 # 平台默认库路径 + sqlite3 原生库
  uuid: ^4.5.3 # 客户端生成 UUID v4（SPEC §6.1）
  # 预声明，本阶段未使用（SPEC §5.3 关键依赖）
  dio: ^5.10.0 # API client → M2-06
  flutter_secure_storage: ^10.0.0 # 令牌存储 → M2 登录流
  barcode_widget: ^2.0.4
  mobile_scanner: ^7.2.0
  permission_handler: ^12.0.3
  image_picker: ^1.2.2 # 相册选图（M1-04）
  image_picker_android: ^0.8.13 # 启用 Android Photo Picker（免全相册权限）
  image_picker_platform_interface: ^2.11.1
  screen_brightness: ^2.1.11 # 展示页亮度拉满（M1-07）
  wakelock_plus: ^1.6.1 # 展示页屏幕常亮（M1-07）

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.0
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true
  generate: true
